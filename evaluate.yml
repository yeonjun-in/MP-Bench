name: Evaluate Submission

on:
  pull_request:
    paths:
      - "submissions/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Detect changed submission
        id: detect
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
                    | grep '^submissions/' | head -n1)
          if [ -z "$CHANGED" ]; then
            echo "No submission files changed."
            exit 1
          fi
          MODEL_DIR=$(echo "$CHANGED" | cut -d'/' -f1-2)
          echo "model_dir=$MODEL_DIR" >> $GITHUB_OUTPUT
          echo "Detected submission: $MODEL_DIR"

      - name: Validate submission files
        run: |
          MODEL_DIR=${{ steps.detect.outputs.model_dir }}
          for f in metadata.json predictions_manual.json predictions_automatic.json; do
            if [ ! -f "$MODEL_DIR/$f" ]; then
              echo "ERROR: Missing required file: $MODEL_DIR/$f"
              echo "See submissions/README.md for the required format."
              exit 1
            fi
          done
          echo "All required files present."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone raw MP-Bench annotations
        run: |
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/adobe-research/multi-agent-eval-bench.git
          cd multi-agent-eval-bench
          git sparse-checkout set MP-Bench
          cd ..
          echo "Raw annotations ready at: multi-agent-eval-bench/MP-Bench"

      - name: Evaluate
        id: eval
        run: |
          python evaluate_submission.py \
            --submission_dir "${{ steps.detect.outputs.model_dir }}" \
            --raw_bench_dir  multi-agent-eval-bench/MP-Bench \
            --leaderboard    leaderboard.json \
            2>&1 | tee eval_output.txt

          SUMMARY=$(grep -A10 "^--- SUMMARY ---" eval_output.txt || echo "Evaluation failed — see logs.")
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `${{ steps.eval.outputs.summary }}`;
            const body = [
              "## 🏆 MP-Bench Evaluation Results",
              "",
              summary,
              "",
              "---",
              "*Metric: nDCG@5 (Exp) — higher is better*",
              "*Leaderboard updates automatically when this PR is merged.*",
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Commit updated leaderboard
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet leaderboard.json; then
            git add leaderboard.json
            git commit -m "chore: update leaderboard [skip ci]"
            git push
          fi